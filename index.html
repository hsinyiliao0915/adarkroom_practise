<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小屋 (A Dark Room) - 練習專用 / Practice Only</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #262930;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.25s ease;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 1050px;
      max-height: 720px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.65);
      background-color: #000000;
      border: 1px solid #3f4450;
      border-radius: 4px;
      position: relative;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }
    canvas {
      display: block;
      border-radius: 4px;
    }
    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
      #game-container {
        max-width: 100vw;
        max-height: 100vh;
        width: 100vw;
        height: 100vh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      canvas {
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
