<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小黑屋 (A Dark Room) - 練習專用 / Practice Only</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0e11;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 1050px;
      max-height: 720px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.85);
      background-color: #0d0e12;
      border: 1px solid #232733;
      border-radius: 4px;
      position: relative;
    }
    canvas {
      display: block;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
