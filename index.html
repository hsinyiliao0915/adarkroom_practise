<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小屋 (A Dark Room) - 練習專用 / Practice Only</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #262930;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #app-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px 12px;
    }
    #external-toolbar {
      width: 100%;
      max-width: 1050px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      padding: 0 4px 6px 4px;
      font-size: 13px;
      line-height: 1;
      color: #94a3b8;
    }
    .tool-btn {
      cursor: pointer;
      color: #94a3b8;
      transition: color 0.15s ease;
      white-space: nowrap;
    }
    .tool-btn:hover {
      color: #ffffff;
    }
    .tool-sep {
      color: #475569;
      font-size: 12px;
    }
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 1050px;
      max-height: 720px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.65);
      background-color: #000000;
      border: 1px solid #3f4450;
      border-radius: 4px;
      position: relative;
    }
    canvas {
      display: block;
      border-radius: 4px;
    }
    @media (max-width: 768px), (max-aspect-ratio: 1/1) {
      #app-wrapper {
        padding: 0;
        justify-content: flex-start;
      }
      #external-toolbar {
        max-width: 100vw;
        padding: 8px 10px 6px 10px;
        gap: 6px;
        font-size: 12px;
        justify-content: space-between;
      }
      #game-container {
        flex: 1;
        max-width: 100vw;
        max-height: calc(100vh - 34px);
        width: 100vw;
        height: calc(100vh - 34px);
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
      canvas {
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div id="app-wrapper">
    <div id="external-toolbar">
      <span class="tool-btn" id="btn-theme">[ 開燈 ]</span>
      <span class="tool-sep">|</span>
      <span class="tool-btn" id="btn-auto">[ 自動: 關 ]</span>
      <span class="tool-sep">|</span>
      <span class="tool-btn" id="btn-speed">[ 加速 ]</span>
      <span class="tool-sep">|</span>
      <span class="tool-btn" id="btn-save">[ 存檔管理 ]</span>
      <span class="tool-sep">|</span>
      <span class="tool-btn" id="btn-newgame">[ 新遊戲 ]</span>
    </div>
    <div id="game-container"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
